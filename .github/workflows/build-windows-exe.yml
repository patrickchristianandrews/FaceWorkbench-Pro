name: Build single-file Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-exe.yml'
      - '*.py'
      - 'requirements.txt'
      - 'static/**'

concurrency:
  group: faceworkbench-windows-exe-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out FaceWorkbench Pro
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run smoke tests
        shell: pwsh
        run: |
          python -m pip install pytest httpx
          python -m pytest -q test_smoke.py
      - name: Download and verify OpenCV Zoo face models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path models | Out-Null
          $items = @(
            @{ Name = 'face_detection_yunet_2023mar.onnx'; Kind = 'face_detection_yunet'; Hash = '8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4' },
            @{ Name = 'face_recognition_sface_2021dec.onnx'; Kind = 'face_recognition_sface'; Hash = '0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79' }
          )
          foreach ($item in $items) {
            $url = "https://huggingface.co/opencv/opencv_zoo/resolve/main/models/$($item.Kind)/$($item.Name)"
            $destination = "models/$($item.Name)"
            Invoke-WebRequest -Uri $url -OutFile $destination -MaximumRedirection 8
            $actual = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $item.Hash) { throw "Model hash mismatch: $($item.Name) actual $actual" }
          }
      - name: Compile single-file Windows desktop executable
        shell: pwsh
        run: |
          python -m PyInstaller desktop.py --name FaceWorkbench-Pro --onefile --windowed --noconfirm --clean --add-data "static;static" --add-data "models;models" --collect-all webview --collect-all onnxruntime --collect-all faiss --collect-submodules sklearn --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan.on
          if (!(Test-Path "dist/FaceWorkbench-Pro.exe")) { throw "Executable not created" }
      - name: Verify compiled EXE starts without a console
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/FaceWorkbench-Pro.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          if (-not $process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged EXE startup timed out'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged EXE self-test failed with exit code $($process.ExitCode)"
          }
      - name: Upload downloadable executable
        uses: actions/upload-artifact@v4
        with:
          name: FaceWorkbench-Pro-Windows-EXE
          path: dist/FaceWorkbench-Pro.exe
          if-no-files-found: error
          retention-days: 30
